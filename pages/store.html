<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/store.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
        <img width="30" height="30" class="d-inline-block align-text-top" id="logo">
        Vector Quest
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
            <a class="nav-link" href="./profile.html">
                <img width="24" height="24" id="profile-icon">
                Perfil
            </a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="./menu.html">
                <img width="24" height="24" id="level-icon">
                Niveles
            </a>
            </li>
             <li class="nav-item">
            <a class="nav-link" href="./store.html">
                <img width="24" height="24" id="store-icon">
                Tienda
            </a>
            </li>
            <li class="nav-item">
            <a class="nav-link" href="./store.html">
                <img width="24" height="24" id="personalize-icon">
                Personalizar
            </a>
            </li>
        </ul>

        </div>
    </div>
    </nav>

    <div class="content">
        <div class="left">
            <div class="monedas">
                <p id="monedas_title">MONEDAS: </p>
                <span id="monedas_value"> $1250</span>
                <img src="../assets/coin.svg"  width="24" height="24">
            </div>

            <div class="duck">
                <div class="duck_container">
                    <img src="../assets/ducky.svg" alt="Duck Image" class="d-inline-block align-text-top" height="80%">
                </div>
                <div class="duck_info">
                    <p id="duck_name">Tu pato</p>
                    <p id="duck_description">Equipa items para mejorar tu estilo</p>
                </div>
            </div>

            <div class="menu">
                <button class="btn_menu active">
                    <img src="../assets/hat-white.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                    Sombreros
                </button>
                <button class="btn_menu inactive">
                    <img src="../assets/bowtie.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                    Camisas
                </button>
                <button class="btn_menu inactive">
                    <img src="../assets/bowtie.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                    Zapatos
                </button>
                <button class="btn_menu inactive">
                    <img src="../assets/bowtie.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                    Accesorios
                </button>
            </div>
        </div>
        <div class="right">
            <div class="store_title">
                <div class="store_title_text">
                <img src="../assets/hat-green.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                <p>
                    <span id="tipo_item">Sombreros</span>
                </p>
                <p>Shop</p>
                </div>
                <div class="items">
                    <span id="items_number">5</span>
                    <p>ITEMS</p>
                </div>
            </div>
            
            <div data-bs-spy="scroll" data-bs-smooth-scroll="true" class="scrollspy-example-2" tabindex="0">
                <div class="card selected placeholder-wave">
                    <img src="https://www.kurin.com/wp-content/uploads/placeholder-square.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title"><span id="item1">Gorra de béisbol</span></h5>
                        <div class="owned">
                            Owned
                        </div>
                        <button class="buy invisible">
                                <img src="../assets/coin.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                                <span id="item1_price">50</span>
                        </button>
                    </div>
                </div>

                <div class="card">
                    <img src="https://www.kurin.com/wp-content/uploads/placeholder-square.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title"><span id="item2">Sombrero de vaquero</span></h5>
                        <div class="owned invisible">
                            Owned
                        </div>
                        <button class="buy">
                                <img src="../assets/coin.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                                <span id="item2_price">100</span>
                        </button>
                    </div>
                </div>

                <div class="card">
                    <img src="https://www.kurin.com/wp-content/uploads/placeholder-square.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title"><span id="item3">Gorro de Fiesta</span></h5>
                        <div class="owned invisible">
                            Owned
                        </div>
                        <button class="buy">
                                <img src="../assets/coin.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                                <span id="item3_price">150</span>
                        </button>
                    </div>
                </div>

                <div class="card">
                    <img src="https://www.kurin.com/wp-content/uploads/placeholder-square.jpg" class="card-img-top" alt="...">
                    <div class="card-body">
                        <h5 class="card-title"><span id="item3">Gorro de Fiesta</span></h5>
                        <div class="owned invisible">
                            Owned
                        </div>
                        <button class="buy">
                                <img src="../assets/coin.svg" alt="Logo" width="16" height="16" class="d-inline-block align-text-top">
                                <span id="item3_price">150</span>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <!--Bootstrap JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
